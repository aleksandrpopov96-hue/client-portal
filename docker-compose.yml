services:
  client-portal:
    build: .
    container_name: client-portal
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-8080}:8080"
    environment:
      PORTAL_STORAGE_ROOT: /data/files
      PORTAL_DATA_DIR: /data/portal
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD}
    volumes:
      - "${PORTAL_FILES_PATH:-/mnt/tank/clients}:/data/files:rw"
      - "${PORTAL_DATA_PATH:-/mnt/tank/portal-data}:/data/portal"
