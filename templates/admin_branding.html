{% extends "admin_base.html" %}
{% block title %}Branding{% endblock %}
{% block content %}
<div class="page-head"><h1>Branding</h1></div>
<div class="two-col">
  <form method="post" action="{{ url_for('admin.branding') }}" class="form-grid">
    <label>Site / company name
      <input type="text" name="site_name" value="{{ brand.site_name }}">
    </label>
    <label>Tagline
      <input type="text" name="tagline" value="{{ brand.tagline }}">
    </label>
    <label>Primary color
      <input type="color" name="primary_color" value="{{ brand.primary_color }}">
    </label>
    <label>Accent color
      <input type="color" name="accent_color" value="{{ brand.accent_color }}">
    </label>
    <label>Background color
      <input type="color" name="background_color" value="{{ brand.background_color }}">
    </label>
    <label>Card color
      <input type="color" name="card_color" value="{{ brand.card_color }}">
    </label>
    <label>Text color
      <input type="color" name="text_color" value="{{ brand.text_color }}">
    </label>
    <label>Welcome title
      <input type="text" name="welcome_title" value="{{ brand.welcome_title }}">
    </label>
    <label>Welcome message
      <textarea name="welcome_message" rows="3">{{ brand.welcome_message }}</textarea>
    </label>
    <label>Footer text
      <input type="text" name="footer_text" value="{{ brand.footer_text }}">
    </label>
    <div class="form-actions">
      <button type="submit" class="btn primary">Save branding</button>
    </div>
  </form>

  <form method="post" action="{{ url_for('admin.logo_upload') }}" enctype="multipart/form-data" class="form-grid logo-box">
    <h2>Logo</h2>
    {% if brand.logo_uri %}<img class="logo-preview" src="{{ brand.logo_uri }}" alt="logo">{% endif %}
    <label>Upload logo image
      <input type="file" name="logo" accept="image/*">
    </label>
    <button type="submit" class="btn primary">Upload</button>
    {% if brand.logo_uri %}
    <p class="muted">Logo URL: <code>{{ brand.logo_uri }}</code></p>
    {% endif %}
  </form>
</div>
{% endblock %}
